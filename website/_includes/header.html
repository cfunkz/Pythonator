<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/website/assets/icon-256.png' | relative_url }}" alt="" width="30" height="30">
      <span>Pythonator</span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="{{ '/docs/' | relative_url }}"{% if page.url contains '/docs/' %} aria-current="page"{% endif %}>Docs</a>
      <a href="{{ '/docs/security.html' | relative_url }}"{% if page.url contains 'security' %} aria-current="page"{% endif %}>Security</a>
      <a href="{{ '/docs/plugin-development.html' | relative_url }}"{% if page.url contains 'plugin-' %} aria-current="page"{% endif %}>Plugins</a>
      <a href="{{ '/CHANGELOG.html' | relative_url }}"{% if page.url contains 'CHANGELOG' %} aria-current="page"{% endif %}>Changelog</a>
      <a href="https://github.com/{{ site.repository }}" class="gh" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>

      <button class="theme-toggle" type="button" aria-label="Switch between light and dark">

        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
      <a class="button small" href="https://github.com/{{ site.repository }}/releases/latest">Download</a>
    </nav>
  </div>
</header>
