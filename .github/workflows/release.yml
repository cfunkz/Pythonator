name: Release

# Push a tag that matches __version__ in pythonator/__init__.py (git tag v0.0.1 && git push origin v0.0.1). This
# builds the installers and portable downloads on each system from the locked, hash-checked dependencies, installs
# and starts each one, attests where every file came from, and publishes a GitHub release with them:
#
#   Windows  Pythonator-<v>-windows-x64-setup.exe (installer) and -windows-x64.zip (portable)
#   Linux    pythonator_<v>_amd64.deb / _arm64.deb and Pythonator-<v>-linux-<arch>.tar.gz
#   macOS    Pythonator-<v>-macos-arm64.dmg (Apple silicon) and -macos-x86_64.dmg (Intel)
#
# Actions > Release > Run workflow builds the same files as downloadable artifacts, without releasing.
# Check a download with  gh attestation verify <file> --repo cfunkz/Pythonator

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows x64, os: windows-latest, program: dist/Pythonator/Pythonator.exe}
          # The oldest glibc still supported: the .deb then runs on Ubuntu 22.04+ and Debian 12+. GitHub retires
          # this image on 2027-04-17: build in a debian:12 container on ubuntu-24.04 before then.
          - {name: Linux x64, os: ubuntu-22.04, program: dist/Pythonator/Pythonator}
          # Raspberry Pi and ARM servers. PyQt6's ARM wheels need glibc 2.39: Ubuntu 24.04+, Debian 13+.
          - {name: Linux arm64, os: ubuntu-24.04-arm, program: dist/Pythonator/Pythonator, optional: true}
          - {name: macOS Apple silicon, os: macos-latest, program: dist/Pythonator.app/Contents/MacOS/Pythonator}
          - {name: macOS Intel, os: macos-15-intel, program: dist/Pythonator.app/Contents/MacOS/Pythonator}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}  # if arm64 fails, the release goes out without it
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - if: github.ref_type == 'tag'
        name: The tag matches the version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(python -c 'import pythonator; print(pythonator.__version__)')" = "$TAG"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - if: runner.os == 'Windows'
        name: Install Inno Setup (for the installer)
        shell: bash
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup --no-progress -y; fi
      - run: python -m pip install --require-hashes -r packaging/requirements-build.lock && python -m pip install --no-deps .
      - run: python packaging/build.py
      - name: Start the built app once
        run: python packaging/smoke_test.py ${{ matrix.program }}
      - if: runner.os == 'Linux'
        name: Install the .deb, start it, remove it
        run: |
          sudo apt-get install -y ./release/*.deb
          python packaging/smoke_test.py /usr/bin/pythonator
          sudo apt-get remove -y pythonator
      - if: runner.os == 'Windows'
        name: Install with the installer, start it, uninstall it
        shell: pwsh
        run: ./packaging/test_installer.ps1
      - if: runner.os == 'macOS'
        name: Open the .dmg and start the app inside
        shell: bash
        run: |
          hdiutil attach release/*.dmg -mountpoint /tmp/pythonator-dmg -nobrowse
          python packaging/smoke_test.py /tmp/pythonator-dmg/Pythonator.app/Contents/MacOS/Pythonator
          hdiutil detach /tmp/pythonator-dmg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: release-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md  # the release notes start with this version's section
          sparse-checkout-cone-mode: false
      # v8 fails when an artifact's digest doesn't match (v7 only warned).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # attest-build-provenance is now only a wrapper around actions/attest, with the same input.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # This version's section of CHANGELOG.md ("## [1.2.3] - date" up to the next "## "), without its heading.
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md || true
          cat >> notes.md << EOF

          ## Downloads

          | System | File |
          | --- | --- |
          | Windows 10/11 | \`Pythonator-$VERSION-windows-x64-setup.exe\` (installer) or \`-windows-x64.zip\` (portable) |
          | macOS, Apple silicon (M1 and later) | \`Pythonator-$VERSION-macos-arm64.dmg\` |
          | macOS, Intel | \`Pythonator-$VERSION-macos-x86_64.dmg\` |
          | Ubuntu, Debian, Mint (x64) | \`pythonator_${VERSION}_amd64.deb\`: \`sudo apt install ./pythonator_${VERSION}_amd64.deb\` |
          | Raspberry Pi OS, ARM Linux (arm64) | \`pythonator_${VERSION}_arm64.deb\` |
          | Other Linux | \`Pythonator-$VERSION-linux-<arch>.tar.gz\`: unpack and run \`Pythonator/Pythonator\` |

          **Windows:** the files aren't code signed, so SmartScreen may say "Windows protected your PC". Click
          **More info**, then **Run anyway**.

          **macOS:** the app isn't notarized, so macOS blocks it the first time. Open it once, then go to
          **System Settings > Privacy & Security**, scroll down and click **Open Anyway**. Or, in Terminal:
          \`xattr -dr com.apple.quarantine /Applications/Pythonator.app\`.

          **Check a download:** checksums are in \`SHA256SUMS.txt\`, and every file has a build provenance
          attestation: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "Pythonator $VERSION" \
            --notes-file notes.md --verify-tag "${prerelease[@]}"
