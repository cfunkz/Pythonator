name: Release

# Releasing is automatic: change __version__ in pythonator/__init__.py (the one place the version is
# written), commit and push to main. This workflow then builds every package, creates the vX.Y.Z tag on that
# commit and publishes a GitHub release with the files attached:
#
#   Windows  Pythonator-<v>-windows-x64-setup.exe (installer) and -windows-x64.zip (portable)
#   Linux    pythonator_<v>_amd64.deb / _arm64.deb and Pythonator-<v>-linux-<arch>.tar.gz
#   macOS    Pythonator-<v>-macos-arm64.dmg (Apple silicon) and -macos-x86_64.dmg (Intel)
#
# Other ways in, all safe to mix:
#   * Push a tag yourself (git tag vX.Y.Z && git push origin vX.Y.Z). It must match __version__ on that commit.
#   * Actions tab > Release > Run workflow: builds the packages as downloadable artifacts only, or
#     tick "publish" to release the version on main if it hasn't been released yet.
#   * Pushing the same tag again rebuilds and replaces the files of the existing release.
# A push to main that changes pythonator/__init__.py without a new version does nothing.

on:
  push:
    branches: [main]
    paths: ["pythonator/__init__.py"]  # the version lives here; path filters don't apply to tag pushes
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in pythonator/__init__.py (creates the tag if it doesn't exist)"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, so a branch push and a tag push for the same version never race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - name: Decide what to release
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(python3 -c "import pythonator; print(pythonator.__version__)")
          tag="v$version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error file=pythonator/__init__.py::__version__ = \"$version\" isn't a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; }

          build=true
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is on a commit whose pythonator/__init__.py says version $version." \
                "Delete the tag and tag the commit that sets ${GITHUB_REF_NAME#v}," \
                "or just change __version__ and push to main: the tag is then made for you."
              exit 1
            fi
            publish=true
          elif [[ "$EVENT" == "push" || "$PUBLISH_INPUT" == "true" ]]; then
            if [[ "$EVENT" != "push" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
              echo "::error::Publish a release from $DEFAULT_BRANCH, not $GITHUB_REF_NAME."
              exit 1
            fi
            if tag_exists; then
              echo "::notice::$tag already exists, so there is nothing new to release." \
                "Change __version__ in pythonator/__init__.py to release a new version."
              [[ "$EVENT" == "push" ]] && build=false
            else
              publish=true
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$GITHUB_SHA"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Pythonator $version"
            if [[ "$publish" == "true" ]]; then echo "Building and publishing release **$tag**."
            elif [[ "$build" == "true" ]]; then echo "Building packages only (download them from this run's artifacts)."
            else echo "Nothing to do: $tag is already released."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            program: dist/Pythonator/Pythonator.exe
          - name: Linux x64
            os: ubuntu-22.04  # the oldest glibc still supported: the .deb then runs on Ubuntu 22.04+ and Debian 12+
            program: dist/Pythonator/Pythonator
          - name: Linux arm64
            # Raspberry Pi and ARM servers. PyQt6's ARM wheels need glibc 2.39: Ubuntu 24.04+, Debian 13+.
            os: ubuntu-24.04-arm
            program: dist/Pythonator/Pythonator
            optional: true  # if it fails the release still goes out, without the arm64 files
          - name: macOS Apple silicon
            os: macos-latest
            program: dist/Pythonator.app/Contents/MacOS/Pythonator
          - name: macOS Intel
            os: macos-15-intel
            program: dist/Pythonator.app/Contents/MacOS/Pythonator
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - if: runner.os == 'Windows'
        name: Install Inno Setup (for the installer)
        shell: bash
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup --no-progress -y; fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . jedi pyinstaller pillow
      - run: python packaging/build.py
      - name: Start the built app once
        run: python packaging/smoke_test.py ${{ matrix.program }}
      - if: runner.os == 'Linux'
        name: Install the .deb and start it
        run: sudo apt-get install -y ./release/*.deb && python packaging/smoke_test.py /usr/bin/pythonator
      - if: runner.os == 'Windows'
        name: Check the installer was built
        shell: bash
        run: ls release/*-setup.exe
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the release
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          ls -l release
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists: replacing its files."
            gh release upload "$TAG" release/* --clobber
          else
            cat > notes.md << EOF
          ## Downloads

          | System | File |
          | --- | --- |
          | Windows 10/11 | \`Pythonator-$VERSION-windows-x64-setup.exe\` (installer) or \`-windows-x64.zip\` (portable) |
          | macOS, Apple silicon (M1 and later) | \`Pythonator-$VERSION-macos-arm64.dmg\` |
          | macOS, Intel | \`Pythonator-$VERSION-macos-x86_64.dmg\` |
          | Ubuntu, Debian, Mint (x64) | \`pythonator_${VERSION}_amd64.deb\`: \`sudo apt install ./pythonator_${VERSION}_amd64.deb\` |
          | Raspberry Pi OS, ARM Linux (arm64) | \`pythonator_${VERSION}_arm64.deb\` |
          | Other Linux | \`Pythonator-$VERSION-linux-<arch>.tar.gz\`: unpack and run \`Pythonator/Pythonator\` |

          The macOS app isn't signed with a Developer ID: the first time, right-click it and choose **Open**.
          Checksums are in \`SHA256SUMS.txt\`.

          EOF
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            # --target creates the tag on the built commit when it doesn't exist yet (a version change on main).
            gh release create "$TAG" release/* --target "$SHA" --title "Pythonator $VERSION" \
              --notes-file notes.md --generate-notes "${prerelease[@]}"
          fi
          echo "https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
