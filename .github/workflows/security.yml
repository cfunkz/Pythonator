name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: advisories land without a code change

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir pip-audit==2.9.0
      - run: pip-audit --strict --require-hashes --disable-pip -r requirements.lock -r requirements-build.lock

  default-images:
    # Every image a template suggests must exist (a template once named an image that never existed).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --only-binary=":all:" -r requirements.lock -r requirements-build.lock && pip install --no-deps --no-build-isolation -e .
      - run: |
          for image in $(python -c "from pythonator.policy.runtimes import RUNTIMES; print(' '.join(sorted({r.image for r in RUNTIMES.values() if r.image})))"); do
            echo "checking $image"
            docker manifest inspect "$image" > /dev/null
          done
