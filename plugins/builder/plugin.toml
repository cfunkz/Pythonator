# A 1-click project builder: web apps, APIs, bots and workers as services.
[plugin]
id = "builder"
name = "Project builder"
version = "1.1.0"
api = 4
entry = "plugin.py"
description = "New React, Vue, Nuxt, Express, FastAPI, Flask or Django apps, Discord, Telegram or WhatsApp bots and workers in one click, made by official tools in a sandbox and added as services. Deleting one asks you first."
permissions = ["create_services", "ui"]
author = "cfunkz <hello@routezero.tech>"
homepage = "https://github.com/cfunkz/Pythonator/tree/main/plugins/builder"

[[plugin.settings]]
key = "folder"
label = "Projects folder"
kind = "text"
default = ""
help = "Where new projects go, each in a new folder of its own name. Empty: a Pythonator Projects folder in your home folder."

[[plugin.settings]]
key = "start"
label = "Start a new project once it is made"
kind = "bool"
default = true
