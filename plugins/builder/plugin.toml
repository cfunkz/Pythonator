# A 1-click project builder: web apps, APIs, bots and workers as services.
[plugin]
id = "builder"
name = "Project builder"
version = "1.4.0"
api = 5
entry = "plugin.py"
description = "New web apps and APIs (React, Vue, Svelte, Next.js, Nuxt, Astro, Angular, Express, Fastify, FastAPI, Django, Streamlit, Go, Rust, Bun, Java, PHP, Ruby and more), bots and workers in one click, made by official tools in a sandbox and added as services. Deleting one asks you first."
permissions = ["create_services", "ui"]
author = "cfunkz <hello@routezero.tech>"
homepage = "https://github.com/cfunkz/Pythonator/tree/main/plugins/builder"

[[plugin.settings]]
key = "folder"
label = "Projects folder"
kind = "text"
default = ""
help = "Where new projects go, each in a new folder of its own name. Empty: a Pythonator Projects folder in your home folder."

[[plugin.settings]]
key = "start"
label = "Start a new project once it is made"
kind = "bool"
default = true

[[plugin.settings]]
key = "leftovers"
label = "Refresh looks for leftover project folders"
kind = "bool"
default = false
help = "Folders in the projects folder no service uses any more: a project removed with its folder kept, or a delete a locked file stopped halfway. Pythonator asks you which ones to delete."
