# A UI plugin: a live panel with buttons, built from the plugin design system (pythonator.sdk.ui).
[plugin]
id = "health"
name = "Health checks"
version = "1.0.0"
api = 1
entry = "plugin.py"
description = "Checks the web servers you run: opens each one's port on this computer every few seconds and shows status and response time in a panel."
permissions = ["network", "inspect", "ui"]
author = "cfunkz <hello@routezero.tech>"
homepage = "https://github.com/cfunkz/Pythonator/tree/main/plugins/health"

[[plugin.settings]]
key = "path"
label = "Path to check"
kind = "text"
default = "/"
help = "For example /health. The check is GET http://127.0.0.1:<port><path>."

[[plugin.settings]]
key = "interval"
label = "Seconds between checks"
kind = "int"
default = 30

[[plugin.settings]]
key = "timeout"
label = "Timeout (seconds)"
kind = "int"
default = 5

[[plugin.settings]]
key = "alert"
label = "Notify when a check starts failing"
kind = "bool"
default = true
